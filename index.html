<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAUN CAFFE — Digital Menu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #F5EBDD;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
      background-color: #F5EBDD;
    }
    .fallback {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #F5EBDD;
      color: #2B241E;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .fallback.show {
      display: flex;
    }
    .fallback-card {
      max-width: 400px;
      background: #FBF6EE;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 12px 30px rgba(43, 36, 30, 0.08);
    }
    .fallback-card h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }
    .fallback-card p {
      font-size: 14px;
      color: #5C4E42;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .fallback-card a {
      display: inline-block;
      background: #2B241E;
      color: #FBF6EE;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe
      id="daunCaffeFrame"
      src="https://script.google.com/macros/s/AKfycbzV6dLzQpZL0lF4Lz7SuN4X8ltje43mZ6vXd6nXOSjmeQxuqoOh28kIKgXvADnnq97v/exec"
      title="DAUN CAFFE"
      allow="clipboard-read; clipboard-write"
      loading="eager"
    ></iframe>
  </div>

  <div id="fallbackBox" class="fallback">
    <div class="fallback-card">
      <h2>Buka DAUN CAFFE</h2>
      <p>Jika tampilan menu tidak muncul otomatis, silakan buka langsung melalui tautan resmi di bawah ini.</p>
      <a href="https://script.google.com/macros/s/AKfycbzV6dLzQpZL0lF4Lz7SuN4X8ltje43mZ6vXd6nXOSjmeQxuqoOh28kIKgXvADnnq97v/exec" target="_blank" rel="noopener noreferrer">Buka Menu DAUN CAFFE</a>
    </div>
  </div>

  <script>
    (function () {
      var targetUrl = "https://script.google.com/macros/s/AKfycbzV6dLzQpZL0lF4Lz7SuN4X8ltje43mZ6vXd6nXOSjmeQxuqoOh28kIKgXvADnnq97v/exec";
      var frame = document.getElementById("daunCaffeFrame");
      var fallback = document.getElementById("fallbackBox");
      var loaded = false;

      if (frame) {
        frame.addEventListener("load", function () {
          loaded = true;
        });
      }

      setTimeout(function () {
        if (!loaded && fallback) {
          fallback.classList.add("show");
        }
      }, 8000);
    })();
  </script>
</body>
</html>
